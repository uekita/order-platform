version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend-tests
  - package-ecosystem: maven
    directory: /services/order-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - order-service
  - package-ecosystem: maven
    directory: /qa/backend-test-automation
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend-tests
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
