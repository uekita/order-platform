# Development environment defaults. CI overrides these with the repository /
# environment variables API_BASE_URI, DB_URL, DB_USERNAME, DB_PASSWORD and
# KAFKA_BOOTSTRAP_SERVERS. Never commit real credentials.
api.base.uri=https://dev-api.example.com

db.url=jdbc:postgresql://dev-db.example.com:5432/orders?sslmode=require
db.username=qa_readonly
db.password=

kafka.bootstrap.servers=dev-kafka.example.com:9092
kafka.topic.order.events=order-events.v1
kafka.topic.order.events.dlq=order-events.v1.dlq
