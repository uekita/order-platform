# ---------------------------------------------------------------------------
# Shared defaults for every environment. Environment files override these.
# Precedence (lowest to highest):
#   config/default.properties
#   config/<env>.properties
#   environment variables (API_BASE_URI, DB_URL, ...)
#   JVM system properties (-Dapi.base.uri=...)
# ---------------------------------------------------------------------------
api.base.path=/api/v1
api.timeout.ms=15000
api.log.requests=false
api.tls.insecure=false
api.token=

wait.timeout.seconds=30
wait.poll.millis=250

db.pool.size=10
db.connection.timeout.ms=10000

kafka.consumer.group.prefix=qa-backend
kafka.consumer.poll.timeout.ms=500
kafka.producer.timeout.seconds=10
kafka.event.timeout.seconds=30
kafka.security.protocol=PLAINTEXT
kafka.sasl.mechanism=
kafka.sasl.username=
kafka.sasl.password=
